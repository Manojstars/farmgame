name: Build APK
on:
  push:
    branches: [ agents/vscode-dev-infrastructure-setup ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Run TypeScript check
        run: npm run tsc
      
      - name: Run tests  
        run: npm test -- --runInBand
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Create React Native Android project
        run: |
          echo "Creating React Native Android template..."
          
          # Create temp directory for RN template
          mkdir -p rn-template
          cd rn-template
          
          # Use react-native init to create template (no Expo, no install flag)
          npx react-native@0.74.0 init TemplateApp --npm 2>&1 || \
          npx react-native init TemplateApp --npm 2>&1 || true
          
          cd ..
          
          # Extract android directory
          if [ -d "rn-template/TemplateApp/android" ]; then
            echo "✓ Android template created"
            mv rn-template/TemplateApp/android ./
            rm -rf rn-template
          else
            echo "✗ Android template creation failed"
            ls -la rn-template/TemplateApp 2>/dev/null || echo "Template directory missing"
            rm -rf rn-template
            exit 1
          fi
      
      - name: Verify gradle wrapper
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi
          chmod +x android/gradlew
          ls -la android/gradlew
      
      - name: Build APK with Gradle
        run: |
          cd android
          
          echo "Building Debug APK..."
          ./gradlew assembleDebug --stacktrace 2>&1
          
          echo ""
          echo "Checking for APK..."
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ APK built successfully!"
            ls -lh app/build/outputs/apk/debug/app-debug.apk
            md5sum app/build/outputs/apk/debug/app-debug.apk
          else
            echo "❌ APK not found"
            find . -name "*.apk" -type f || echo "No APK files found"
            exit 1
          fi
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: game-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
