name: Build APK

on:
  push:
    branches: [ agents/vscode-dev-infrastructure-setup ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Setup Expo
        run: npm install -g expo-cli
      
      - name: Prebuild Android
        run: npx expo prebuild --clean --platform android --no-install
        continue-on-error: true
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Build with Gradle (fallback if prebuild failed)
        if: always()
        run: |
          if [ ! -d "android" ]; then
            echo "Android directory not created, attempting React Native init..."
            npx react-native init FarmGameApp --template typescript 2>/dev/null || true
            if [ -d "FarmGameApp/android" ]; then
              cp -r FarmGameApp/android ./android
              rm -rf FarmGameApp
            fi
          fi
          
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "ERROR: Could not create android directory"
            exit 1
          fi
      
      - name: Check for APK
        run: find . -name "app-debug.apk" -type f
      
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: game-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
