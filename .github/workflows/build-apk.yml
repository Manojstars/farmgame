name: Build APK

on:
  push:
    branches: [ agents/vscode-dev-infrastructure-setup ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Setup Expo
        run: npm install -g expo-cli
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Create minimal Android build environment
        run: |
          # Try to prebuild first
          npx expo prebuild --clean --platform android 2>/dev/null || true
          
          # If that failed, create template with create-expo-app
          if [ ! -d "android" ]; then
            echo "Creating minimal Expo app for Android..."
            mkdir -p temp-expo-app
            cd temp-expo-app
            npx create-expo-app@latest .
            cd ..
            
            # If successful, move android folder
            if [ -d "temp-expo-app/android" ]; then
              cp -r temp-expo-app/android ./
              rm -rf temp-expo-app
              echo "Android directory created from template"
            else
              echo "Failed to create android directory from create-expo-app"
              exit 1
            fi
          fi
          
          # Verify gradle wrapper exists
          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: Gradle wrapper not found"
            exit 1
          fi
          
          chmod +x android/gradlew
      
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --info
      
      - name: Check for APK
        run: find . -name "app-debug.apk" -type f
      
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: game-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
