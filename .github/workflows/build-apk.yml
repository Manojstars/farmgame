name: Build APK
on:
  push:
    branches: [ agents/vscode-dev-infrastructure-setup ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Run TypeScript check
        run: npm run tsc
      
      - name: Run tests  
        run: npm test -- --runInBand
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Create minimal Android gradle project
        run: |
          echo "Creating minimal Android project..."
          
          mkdir -p android/{app/src/main/{java/com/farmgame,res/{values,layout}},gradle/wrapper}
          
          # Create build.gradle (root)
          cat > android/build.gradle << 'GRADLE_ROOT'
          buildscript {
              ext {
                  buildToolsVersion = "34.0.0"
                  compileSdkVersion = 34
              }
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath("com.android.tools.build:gradle:7.6.0")
              }
          }
          
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          GRADLE_ROOT
          
          # Create build.gradle (app)
          cat > android/app/build.gradle << 'GRADLE_APP'
          apply plugin: "com.android.application"
          
          android {
              compileSdkVersion 34
              buildToolsVersion "34.0.0"
              namespace "com.farmgame.app"
          
              defaultConfig {
                  applicationId "com.farmgame.app"
                  minSdkVersion 21
                  targetSdkVersion 34
                  versionCode 1
                  versionName "1.0.0"
              }
          
              buildTypes {
                  debug {}
              }
          }
          
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          GRADLE_APP
          
          # Create settings.gradle
          cat > android/settings.gradle << 'GRADLE_SETTINGS'
          rootProject.name = 'FarmGame'
          include ':app'
          GRADLE_SETTINGS
          
          # Create gradle wrapper properties
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'GRADLE_PROPS'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          GRADLE_PROPS
          
          # Download official gradle wrapper script
          curl -s -L -o android/gradlew https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradlew
          curl -s -L -o android/gradlew.bat https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradlew.bat
          chmod +x android/gradlew
          
          echo "✓ Android project created"
      
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace -Dorg.gradle.jvmargs="-Xmx512m" 2>&1
          
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ APK built!"
            ls -lh app/build/outputs/apk/debug/app-debug.apk
          else
            echo "❌ APK not found"
            find . -name "*.apk" -type f 2>/dev/null || echo "No APK files"
            exit 1
          fi
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: game-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
