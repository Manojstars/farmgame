name: Build APK
on:
  push:
    branches: [ agents/vscode-dev-infrastructure-setup ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Run TypeScript check
        run: npm run tsc
      
      - name: Run tests  
        run: npm test -- --runInBand
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Get React Native Android app from GitHub
        run: |
          echo "Downloading React Native Android app..."
          
          mkdir -p rn-src
          cd rn-src
          
          git clone --depth 1 https://github.com/facebook/react-native.git . 2>&1 || exit 1
          
          cd ..
          
          # Use the rn-tester Android app as a base
          if [ -d "rn-src/packages/rn-tester/android" ]; then
            echo "✓ Found rn-tester Android app"
            cp -r rn-src/packages/rn-tester/android ./
            rm -rf rn-src
            
            # Verify gradlew
            if [ -f "android/gradlew" ]; then
              echo "✓ Gradle wrapper ready"
              chmod +x android/gradlew
            else
              echo "✗ No gradlew found"
              ls -la android/ | head -10
              exit 1
            fi
          else
            echo "✗ rn-tester not found"
            ls rn-src/packages/ | grep -i android || echo "No android packages found"
            rm -rf rn-src
            exit 1
          fi
      
      - name: Verify gradle wrapper
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi
          chmod +x android/gradlew
          ls -la android/gradlew
      
      - name: Build APK with Gradle
        run: |
          cd android
          
          echo "Building Debug APK..."
          ./gradlew assembleDebug --stacktrace 2>&1
          
          echo ""
          echo "Checking for APK..."
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ APK built successfully!"
            ls -lh app/build/outputs/apk/debug/app-debug.apk
            md5sum app/build/outputs/apk/debug/app-debug.apk
          else
            echo "❌ APK not found"
            find . -name "*.apk" -type f || echo "No APK files found"
            exit 1
          fi
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: game-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
