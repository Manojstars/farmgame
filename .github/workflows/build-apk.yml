name: Build APK

on:
  push:
    branches: [ agents/vscode-dev-infrastructure-setup ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Setup Expo
        run: npm install -g expo-cli
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android NDK & SDK
        run: |
          # Use GitHub's Android SDK tools
          echo "Android SDK is already available via android-sdk action"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms/" 2>/dev/null | head -5 || echo "Checking SDK..."
          
      - name: Create React Native Android project
        run: |
          # Create a bare React Native app
          echo "Creating bare React Native Android project..."
          npx react-native@0.74.0 init FarmGameBare --typescript --npm 2>&1 || \
          npx @react-native-community/cli init FarmGameBare --typescript --npm 2>&1 || \
          npx react-native@latest init FarmGameBare --typescript --npm
          
          # Check if android was created
          if [ ! -d "FarmGameBare/android" ]; then
            echo "ERROR: Failed to generate android directory"
            exit 1
          fi
          
          # Move android directory to project root
          mv FarmGameBare/android ./
          
          # Verify structure
          echo "Android directory structure:"
          ls -la ./android/ | head -10
          
          # Verify gradle wrapper
          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi
          
          chmod +x android/gradlew
          
          # Keep only what we need
          rm -rf FarmGameBare
          
          echo "Android setup complete"
      
      - name: Setup Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --version
          
      - name: Build Debug APK
        run: |
          cd android
          # First clean
          ./gradlew clean
          # Then build
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tail -200
      
      - name: Check for APK
        run: find . -name "app-debug.apk" -type f
      
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: game-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
