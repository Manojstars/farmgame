name: Build APK
on:
  push:
    branches: [ agents/vscode-dev-infrastructure-setup ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Run TypeScript check
        run: npm run tsc
      
      - name: Run tests  
        run: npm test -- --runInBand
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Create React Native Android project
        run: |
          echo "Creating React Native Android template..."
          
          # Create temp directory
          mkdir -p rn-temp
          cd rn-temp
          
          # Run react-native init - it will show iOS error but Android should still work
          # Use set +e to allow script to continue even if command "fails"
          set +e
          npx react-native@0.74.0 init TemplateApp --npm 2>&1
          RESULT=$?
          set -e
          
          echo "react-native init exited with code: $RESULT"
          
          cd ..
          
          # Check if android directory exists, regardless of exit code
          sleep 2
          
          echo "Checking for android directory..."
          if [ -d "rn-temp/TemplateApp/android" ]; then
            echo "✓ Android directory found!"
            ls -la rn-temp/TemplateApp/android | head -10
            mv rn-temp/TemplateApp/android ./
            rm -rf rn-temp
            echo "✓ Ready to build"
          else
            echo "✗ Android directory NOT found"
            echo "Contents of rn-temp/TemplateApp:"
            find rn-temp/TemplateApp -maxdepth 2 -type d 2>/dev/null | head -20 || echo "Cannot list contents"
            rm -rf rn-temp
            exit 1
          fi
      
      - name: Verify gradle wrapper
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi
          chmod +x android/gradlew
          ls -la android/gradlew
      
      - name: Build APK with Gradle
        run: |
          cd android
          
          echo "Building Debug APK..."
          ./gradlew assembleDebug --stacktrace 2>&1
          
          echo ""
          echo "Checking for APK..."
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ APK built successfully!"
            ls -lh app/build/outputs/apk/debug/app-debug.apk
            md5sum app/build/outputs/apk/debug/app-debug.apk
          else
            echo "❌ APK not found"
            find . -name "*.apk" -type f || echo "No APK files found"
            exit 1
          fi
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: game-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
