name: Build APK
on:
  push:
    branches: [ agents/vscode-dev-infrastructure-setup ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Run TypeScript check
        run: npm run tsc
      
      - name: Run tests  
        run: npm test -- --runInBand
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Create minimal Android gradle project
        run: |
          echo "Creating minimal Android gradle project from scratch..."
          
          # Create directory structure
          mkdir -p android/app/src/main/java/com/farmgame/app
          mkdir -p android/app/src/main/res/values
          mkdir -p android/gradle/wrapper
          mkdir -p android/.gradle
          
          # Create gradle-wrapper.properties
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          
          # Download gradle wrapper script
          curl -L -o android/gradlew https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradlew 2>/dev/null || echo "Could not download gradlew script"
          chmod +x android/gradlew || true
          
          # Verify we can at least try gradle
          echo "Gradle setup attempt complete"
      
      - name: Verify gradle wrapper
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi
          chmod +x android/gradlew
          ls -la android/gradlew
      
      - name: Build APK with Gradle
        run: |
          cd android
          
          echo "Building Debug APK..."
          ./gradlew assembleDebug --stacktrace 2>&1
          
          echo ""
          echo "Checking for APK..."
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ APK built successfully!"
            ls -lh app/build/outputs/apk/debug/app-debug.apk
            md5sum app/build/outputs/apk/debug/app-debug.apk
          else
            echo "❌ APK not found"
            find . -name "*.apk" -type f || echo "No APK files found"
            exit 1
          fi
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: game-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
